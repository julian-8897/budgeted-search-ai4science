[project]
name = "budgeted-search"
version = "0.1.0"
description = "Budgeted language-guided experiment search"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
optuna = ["optuna>=4.8.0"]
llm = ["openai>=2.14.0"]
paper = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["budgeted_search*"]

[tool.setuptools.package-data]
budgeted_search = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
